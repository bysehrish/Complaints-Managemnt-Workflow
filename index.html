    <script>
      // GitHub Pages SPA redirect handler
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');
        if (redirectPath) {
          window.history.replaceState(null, null, window.location.pathname.replace(/\/$/, '') + '/#/' + redirectPath.replace(/^\//, ''));
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
