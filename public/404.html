<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Complaints Management Dashboard - Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Designed to prevent 404 Not Found errors on page refresh or direct navigation
      (function () {
        var pathSegmentsToKeep = 1; // 1 for project pages (e.g. username.github.io/repo-name/)
        var l = window.location;
        
        // Detect if hosted at custom domain or root vs subpath
        var pathArray = l.pathname.split('/').filter(Boolean);
        var repoName = pathArray.length > 0 ? '/' + pathArray[0] : '';
        
        // Extract remaining route
        var routePath = pathArray.slice(1).join('/');
        var targetHash = routePath ? '#/' + routePath : '';

        // If direct sub-path accessed, redirect back to root of project with hash
        var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoName + '/' + (l.search ? l.search : '') + targetHash;
        
        // Immediate redirection
        window.location.replace(redirectUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 32px 40px;
        max-width: 420px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: 20px;
        margin-bottom: 8px;
        color: #60a5fa;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      a {
        display: inline-block;
        background-color: #2563eb;
        color: #ffffff;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        transition: background 0.2s;
      }
      a:hover {
        background-color: #1d4ed8;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h1>Redirecting to Dashboard...</h1>
      <p>Resolving application route. If you are not redirected automatically within a few seconds, click the button below.</p>
      <a href="./">Return to Complaints Dashboard</a>
    </div>
  </body>
</html>
